<script>
const API_URL = "https://script.google.com/macros/s/AKfycby8S-oXnmyhdKIise-s2ZSba68SYOJKatRBoupw0H22OaahZyw5rmSEAkj2-mLSKrTKig/exec";

fetch(API_URL)
.then(res => res.json())
.then(data => {

  console.log(data); // debug

  let totalKetua = 0;
  let countKetua = 0;

  data.forEach(item => {
    const sub = item.sub.toLowerCase().trim();
    const nilai = Number(item.monitoring) * 100;

    document.querySelectorAll(".label").forEach(label => {
      const textLabel = label.innerText.toLowerCase().trim();

      if(textLabel === sub){
        const bar = label.nextElementSibling.querySelector(".progress-bar");

        bar.style.width = nilai + "%";
        bar.innerText = nilai.toFixed(2) + "%";

        bar.classList.remove("green","yellow","red");

        if(nilai >= 80) bar.classList.add("green");
        else if(nilai >= 60) bar.classList.add("yellow");
        else bar.classList.add("red");
      }
    });

    // hitung overall (tanpa yang "Overall")
    if(item.role === "Ketua" && item.sub !== "Overall"){
      totalKetua += nilai;
      countKetua++;
    }

  });

  // tampilkan overall ketua
  const overall = (totalKetua / countKetua).toFixed(2);
  const bar = document.getElementById("ketua-overall");

  bar.style.width = overall + "%";
  bar.innerText = overall + "%";

});
</script>
